name: Release Rinku.More (NuGet)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which Rinku.More version part to bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release-rinku-more
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Rinku.More
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag -l 'rinku-more-v*' --sort=-v:refname | head -n1)
          base="${latest#rinku-more-v}"
          [ -z "$base" ] && base="0.0.0"
          IFS='.' read -r major minor patch <<< "$base"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported version bump: $BUMP" >&2; exit 1 ;;
          esac
          next="$major.$minor.$patch"
          if git rev-parse "rinku-more-v$next" >/dev/null 2>&1; then
            echo "Tag rinku-more-v$next already exists." >&2
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=rinku-more-v$next" >> "$GITHUB_OUTPUT"

      - name: Resolve current published Rinku version
        id: rinku
        shell: bash
        run: |
          rinku_version=$(curl --fail --silent https://api.nuget.org/v3-flatcontainer/rinku/index.json | jq -r '[.versions[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | last')
          if [[ -z "$rinku_version" || "$rinku_version" == "null" ]]; then
            echo "Could not resolve a stable published Rinku version." >&2
            exit 1
          fi
          echo "version=$rinku_version" >> "$GITHUB_OUTPUT"
          echo "Using published Rinku $rinku_version"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0

      - name: Restore
        run: |
          dotnet restore Rinku.More/Rinku.More/Rinku.More.csproj
          dotnet restore Rinku.More/Rinku.More.Tests/Rinku.More.Tests.csproj

      - name: Build package
        run: dotnet build Rinku.More/Rinku.More/Rinku.More.csproj --configuration Release --no-restore

      - name: Test package
        run: dotnet test Rinku.More/Rinku.More.Tests/Rinku.More.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Pack package
        run: |
          dotnet restore Rinku.More/Rinku.More/Rinku.More.csproj -p:RinkuMorePack=true -p:RinkuPackageVersion=${{ steps.rinku.outputs.version }}
          dotnet pack Rinku.More/Rinku.More/Rinku.More.csproj --configuration Release --no-restore --output artifacts -p:RinkuMorePack=true -p:RinkuPackageVersion=${{ steps.rinku.outputs.version }} -p:MinVerVersionOverride=${{ steps.version.outputs.version }}

      - name: Verify published Rinku dependency
        shell: bash
        env:
          MORE_VERSION: ${{ steps.version.outputs.version }}
          RINKU_VERSION: ${{ steps.rinku.outputs.version }}
        run: |
          nuspec=$(unzip -p "artifacts/Rinku.More.${MORE_VERSION}.nupkg" Rinku.More.nuspec)
          rinku_version=$(printf '%s' "$nuspec" | sed -n 's/.*<dependency id="Rinku" version="\([^"]*\)".*/\1/p')
          if [ -z "$rinku_version" ]; then
            echo "Rinku.More does not declare its Rinku dependency." >&2
            exit 1
          fi
          if [ "$rinku_version" != "$RINKU_VERSION" ]; then
            echo "Rinku.More $MORE_VERSION declares Rinku $rinku_version, expected $RINKU_VERSION." >&2
            exit 1
          fi
          dependency_url="https://api.nuget.org/v3-flatcontainer/rinku/${rinku_version}/rinku.${rinku_version}.nupkg"
          curl --fail --silent --show-error --head "$dependency_url" >/dev/null
          echo "Verified published dependency: Rinku $rinku_version"

      - name: Upload package for review
        uses: actions/upload-artifact@v4
        with:
          name: rinku-more-${{ steps.version.outputs.version }}
          path: artifacts/Rinku.More.${{ steps.version.outputs.version }}.nupkg

  publish:
    name: Publish Rinku.More
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: rinku-more-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0

      - name: Get a short-lived NuGet key (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/Rinku.More.${{ needs.build.outputs.version }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"
          git tag -a "${{ needs.build.outputs.tag }}" -m "Release Rinku.More ${{ needs.build.outputs.version }}"
          git push origin "${{ needs.build.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ needs.build.outputs.tag }}" "artifacts/Rinku.More.${{ needs.build.outputs.version }}.nupkg" --title "Rinku.More ${{ needs.build.outputs.version }}" --generate-notes
